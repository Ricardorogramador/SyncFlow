spring.application.name=PA-SaaS2
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:saas_calendar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000
server.port=8080

api.gemini.key=${GEMINI_API_KEY}
api.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
